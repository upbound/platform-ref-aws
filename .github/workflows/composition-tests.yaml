name: Composition Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  composition-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install up
        uses: upbound/action-up@2c4d9663b902087b0808b79fe2c7ec68424d87d8 # v1
        with:
          skip-login: true

      - name: Build project
        run: up project build

      - name: Run composition tests
        run: up test run tests/*
